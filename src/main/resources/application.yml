server:
  port: 8080

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

app:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://10.0.175.10:8082/api/v1}
  beadmin:
    mock: true
  security:
    jwt:
      expiration-ms: 3600000 # 1 hour
      cookie-name: accessToken
  documents:
    zip-url: "/documents/tat-ca-tai-lieu.zip"
    items:
      - name: "Hướng dẫn sử dụng hệ thống"
        size: "200 KB"
        type: "pdf"
        url: "/documents/huong-dan-su-dung.pdf"
      - name: "Hướng dẫn sử dụng hệ thống"
        size: "200 KB"
        type: "doc"
        url: "/documents/huong-dan-su-dung.docx"
      - name: "Hướng dẫn sử dụng hệ thống"
        size: "200 KB"
        type: "pdf"
        url: "/documents/huong-dan-su-dung-v2.pdf"
      - name: "Hướng dẫn sử dụng hệ thống"
        size: "200 KB"
        type: "pdf"
        url: "/documents/huong-dan-su-dung-v3.pdf"
