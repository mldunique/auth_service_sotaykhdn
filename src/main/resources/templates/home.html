<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - Hệ thống Sổ tay KHDN Agribank</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #991f38;
            --secondary-color: #0b8246;
            --accent-color: #ffc72c;
            --bg-gradient: linear-gradient(135deg, #1b090d 0%, #031c0e 100%);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            padding: 20px;
        }

        .dashboard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 24px;
            margin-bottom: 24px;
        }

        .avatar-circle {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            border: 2px solid var(--accent-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .header-info h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .header-info p {
            font-size: 13px;
            color: var(--accent-color);
            font-weight: 500;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 500px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        .info-item {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .info-item label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .info-item span {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        .permissions-section {
            margin-bottom: 30px;
        }

        .permissions-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .perm-tag {
            background: rgba(11, 130, 70, 0.12);
            border: 1px solid rgba(11, 130, 70, 0.3);
            color: #86efac;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 12px;
            padding: 14px;
            color: #fca5a5;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <div class="header-section">
        <div class="avatar-circle" th:text="${#strings.substring(user.fullName, 0, 1)}">N</div>
        <div class="header-info">
            <h2 th:text="${user.fullName}">Nguyễn Văn A</h2>
            <p th:text="${'Vai trò: ' + user.role}">Vai trò: ADMIN</p>
        </div>
    </div>

    <div class="info-grid">
        <div class="info-item">
            <label>Tên đăng nhập</label>
            <span th:text="${user.username}">admin</span>
        </div>
        <div class="info-item">
            <label>Email</label>
            <span th:text="${user.email}">admin.khdn@agribank.com.vn</span>
        </div>
        <div class="info-item">
            <label>Mã chi nhánh</label>
            <span th:text="${user.branchCode}">001</span>
        </div>
        <div class="info-item">
            <label>Mã phòng ban</label>
            <span th:text="${user.departmentCode}">KHDN</span>
        </div>
    </div>

    <div class="permissions-section">
        <h3>Quyền hạn được cấp</h3>
        <div class="tag-container">
            <span class="perm-tag" th:each="perm : ${user.permissions}" th:text="${perm}">PRODUCT_READ</span>
            <span class="perm-tag" th:if="${#lists.isEmpty(user.permissions)}">Không có quyền hạn nào</span>
        </div>
    </div>

    <a th:href="@{/logout}" class="btn-logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Đăng xuất
    </a>
</div>

</body>
</html>
