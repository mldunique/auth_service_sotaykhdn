<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Sổ tay Điện tử KHDN Agribank</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #991f38;   /* Agribank Dark Red */
            --primary-dark: #701224;
            --secondary-color: #0b8246; /* Agribank Green */
            --accent-color: #ffc72c;    /* Agribank Gold */
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --bg-soft: #f9fafb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            background: #ffffff;
            color: var(--text-dark);
        }

        .page {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* ================= LEFT: FORM PANEL ================= */
        .form-panel {
            flex: 0 0 44%;
            max-width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px 64px;
        }

        /* Logo */
        .brand-row {
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: 20%;
            height: 19%;
            flex-shrink: 0;
            object-fit: contain;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--primary-color);
        }

        /* Main content block */
        .content-block {
            width: 100%;
            max-width: 65%;
            margin: 0 auto;
        }

        .headline {
            color: var(--primary-color);
            font-size: 30px;
            font-weight: 700;
            line-height: 1.4;
            text-transform: uppercase;
            margin-top: 10px;
            margin-bottom: 26px;
            letter-spacing: 0.2px;
        }

        h2.form-title {
            font-size: 39px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 24px;
        }

        .error-message {
            background: rgba(220, 38, 38, 0.08);
            border: 1px solid rgba(220, 38, 38, 0.25);
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .error-message svg { flex-shrink: 0; }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .form-group label .required {
            color: var(--primary-color);
        }

        .input-wrapper {
            position: relative;
        }

        .form-control {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-dark);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control::placeholder {
            color: #b0b5bd;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(11, 130, 70, 0.12);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
        }

        .unit-row {
            display: grid;
            grid-template-columns: 96px 1fr;
            gap: 10px;
        }

        .captcha-row {
            display: grid;
            grid-template-columns: 1fr 128px;
            gap: 10px;
        }

        .captcha-box {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: repeating-linear-gradient(
                135deg,
                #f3f4f6,
                #f3f4f6 6px,
                #eceef1 6px,
                #eceef1 12px
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: 3px;
            color: #4b5563;
            user-select: none;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 10px;
            padding: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 12px rgba(153, 31, 56, 0.25);
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(153, 31, 56, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .download-link {
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .download-link a {
            font-size: 12.5px;
            color: var(--secondary-color);
            text-decoration: underline;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* Footer */
        .footer-note {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-top: 40px;
        }

        .footer-note .footer-contact {
            text-align: right;
        }

        .footer-note .footer-contact div {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
        }

        /* ================= RIGHT: IMAGE PANEL ================= */
        .image-panel {
            flex: 1;
            padding: 20px 20px 20px 0;
        }

        .image-frame {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 60%, #3a0a13 100%);
        }

        /* Replace this <img> src with a real photo any time — the frame keeps its size and rounded corners regardless. */
        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .page {
                flex-direction: column;
            }
            .form-panel {
                flex: none;
                max-width: 100%;
                padding: 32px 24px;
            }
            .image-panel {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="page">

    <!-- ================= LEFT: FORM ================= -->
    <div class="form-panel">
        <div class="brand-row">
            <img class="brand-mark" th:src="@{/6da3c4c8f3c8bb4f89064610a2148e2d6ac1e0e9.png}" src="/6da3c4c8f3c8bb4f89064610a2148e2d6ac1e0e9.png" alt="Agribank">
            <!--<span class="brand-name">AGRIBANK</span>-->
            <div class="headline">
                Phần mềm tra cứu sổ tay<br>
                dịch vụ khách hàng doanh nghiệp
            </div>
        </div>

        <div class="content-block">

            <h2 class="form-title">Đăng nhập</h2>

            <!-- Error Alert Box -->
            <div class="error-message" th:if="${error}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span th:text="${error}">Thông tin đăng nhập sai</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Tên đăng nhập<span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Mật khẩu<span class="required">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                        <span class="password-toggle" onclick="togglePassword()">
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="unitCode">Đơn vị</label>
                    <div class="unit-row">
                        <input type="text" id="unitCode" name="unitCode" class="form-control" placeholder="Mã">
                        <input type="text" id="unitName" name="unitName" class="form-control" placeholder="Tài khoản thanh toán" disabled>
                    </div>
                </div>

                <div class="form-group">
                    <label for="captcha">Mã xác thực</label>
                    <div class="captcha-row">
                        <input type="text" id="captcha" name="captcha" class="form-control" placeholder="Nhập mã xác thực" autocomplete="off">
                        <!-- Replace with a real generated captcha image server-side, e.g. th:src="@{/captcha}" -->
                        <div class="captcha-box">097643</div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Đăng nhập</button>
            </form>

            <div class="download-link">
                <a href="#" download>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 3v12"></path>
                        <path d="m7 10 5 5 5-5"></path>
                        <path d="M5 21h14"></path>
                    </svg>
                    Tải xuống tài liệu
                </a>
            </div>
        </div>

        <div class="footer-note">
            <div class="footer-copy">
                © Bản quyền thuộc Agribank<br>
                Phiên bản 1.0 cập nhật 04/2026
            </div>
            <div class="footer-contact">
                <div>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" opacity="0"></path><path d="m22 6-10 7L2 6"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg>
                    banngphangso@agribank.com.vn
                </div>
                <div>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    0123456789 - Văn thư Ban NHS
                </div>
            </div>
        </div>
    </div>

    <!-- ================= RIGHT: IMAGE ================= -->
    <div class="image-panel">
        <div class="image-frame">
            <img th:src="@{/dbc8000d3925819033343d08284c490b5e487500.jpg}" src="/dbc8000d3925819033343d08284c490b5e487500.jpg" alt="Agribank">
        </div>
    </div>

</div>

<script>
    function togglePassword() {
        const pwd = document.getElementById('password');
        const eye = document.getElementById('eye-icon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            eye.innerHTML = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.6 18.6 0 0 1-2.36 3.4"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
            pwd.type = 'password';
            eye.innerHTML = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
    }

    // Tự động đối chiếu và hiển thị tên đơn vị tương ứng khi nhập unitCode
    document.getElementById('unitCode').addEventListener('input', function() {
        const code = this.value.trim();
        const unitNameInput = document.getElementById('unitName');
        if (!code) {
            unitNameInput.value = '';
            return;
        }
        fetch('/api/v1/branches/lookup?code=' + encodeURIComponent(code))
            .then(res => res.json())
            .then(data => {
                if (data && data.name) {
                    unitNameInput.value = data.name;
                } else {
                    unitNameInput.value = '';
                }
            })
            .catch(err => {
                console.error(err);
                unitNameInput.value = '';
            });
    });
</script>

</body>
</html>
